[project]
name = "cairn"
version = "0.1.0"
description = "Engineering org memory as a FalkorDB graph that agents can follow"
authors = [
    { name = "sushanshetty1", email = "sushanshetty1470@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "falkordb>=1.7.1",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
