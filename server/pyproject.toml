[project]
name = "airspace"
version = "0.1.0"
description = "Air-traffic control for parallel coding agents, on a FalkorDB code graph"
authors = [
    { name = "sushanshetty1", email = "sushanshetty1470@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "falkordb>=1.7.1",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
airspace = "airspace.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "-p no:cacheprovider"
