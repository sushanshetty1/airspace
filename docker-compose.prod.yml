# Production stack: FalkorDB, the Airspace API and the web app behind Caddy.
#   Local:  docker compose -f docker-compose.prod.yml up -d --build   (http://localhost:8080)
#   VPS:    set DOMAIN, HTTP_PORT=80 and HTTPS_PORT=443 in .env, then the same command
# See docs/deploy.md.

services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    environment:
      BROWSER: "0"
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./server
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # Sign-in and workspaces. Unset, the site works and sign-in says it is not configured.
      AIRSPACE_PUBLIC_URL: ${AIRSPACE_PUBLIC_URL:-}
      AIRSPACE_SECRET: ${AIRSPACE_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/state', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  web:
    build: ./web
    environment:
      # A domain name turns on automatic HTTPS; unset, Caddy serves plain HTTP on :80.
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Started, not healthy: the site stays up while the API restarts.
    depends_on:
      - api
    restart: unless-stopped

volumes:
  falkordb-data:
  caddy-data:
  caddy-config:
